<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showcases</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f4;
      --text: #171717;
      --muted: #66645e;
      --line: rgba(23, 23, 23, 0.14);
      --surface: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --text: #f4f4f1;
        --muted: #aaa79f;
        --line: rgba(244, 244, 241, 0.18);
        --surface: #1a1a1a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(960px, calc(100vw - 32px));
      margin: 64px auto;
    }
    header {
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
      padding-bottom: 24px;
    }
    h1 {
      font-size: 40px;
      line-height: 1.1;
      margin: 0 0 8px;
    }
    h2 {
      font-size: 20px;
      line-height: 1.2;
      margin: 8px 0;
    }
    a { color: inherit; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    article {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 20px;
    }
    p { color: var(--muted); margin: 8px 0 0; }
    .meta, .small {
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Showcases</h1>
      <p>Published previews generated by the Showcase skill.</p>
    </header>
    <section class="grid">

      <article>
        <div class="meta">temp - Live</div>
        <h2><a href="https://mikec-git.github.io/showcase-skill/temp/temporary-ghpages-test/">Temporary GitHub Pages Test</a></h2>
        <p>Expires 2026-05-31T00:49:24Z</p>
        <p class="small">Created 2026-05-30T00:49:24Z</p>
      </article>
    </section>
  </main>
</body>
</html>
