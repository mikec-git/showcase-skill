<svg xmlns="http://www.w3.org/2000/svg" width="880" height="216" viewBox="0 0 880 216" role="img" aria-label="Pipeline: Prompt to Seeds to Generate to Serve to Verify (fix and re-verify, max 3 passes) to Open in browser.">
  <defs>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#7fe7d0"/>
    </linearGradient>
    <radialGradient id="sheen2" cx="0.5" cy="-0.1" r="1">
      <stop offset="0" stop-color="#161c2a"/>
      <stop offset="0.7" stop-color="#0b0e14"/>
    </radialGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#465067" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#f6a87c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="216" rx="18" fill="url(#sheen2)"/>
  <rect x="0.5" y="0.5" width="879" height="215" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <!-- connectors -->
  <g stroke="#2c3346" stroke-width="2" marker-end="url(#arr)">
    <line x1="111" y1="118" x2="193" y2="118"/>
    <line x1="255" y1="118" x2="337" y2="118"/>
    <line x1="399" y1="118" x2="481" y2="118"/>
    <line x1="543" y1="118" x2="625" y2="118"/>
    <line x1="687" y1="118" x2="769" y2="118"/>
  </g>

  <!-- retry arc: Verify -> Generate -->
  <path d="M656 86 C 600 38, 424 38, 368 86" fill="none" stroke="#f6a87c" stroke-opacity="0.85" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrp)"/>
  <text x="512" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.3" fill="#f6a87c">fix &amp; re-verify · max 3 passes</text>

  <!-- nodes -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- 1 Prompt -->
    <rect x="51" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#8b7cf6" stroke-width="1.5"/>
    <g transform="translate(80,118)" stroke="#8b7cf6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9,-7 L-2,0 L-9,7"/>
      <line x1="1" y1="8" x2="10" y2="8"/>
    </g>
    <text x="80" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Prompt</text>

    <!-- 2 Seeds -->
    <rect x="195" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#a78bf0" stroke-width="1.5"/>
    <g transform="translate(224,118)" fill="#a78bf0">
      <circle cx="-6" cy="-6" r="3.1"/><circle cx="6" cy="-6" r="3.1"/>
      <circle cx="-6" cy="6" r="3.1"/><circle cx="6" cy="6" r="3.1"/>
    </g>
    <text x="224" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Seeds</text>

    <!-- 3 Generate -->
    <rect x="339" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#c98bf0" stroke-width="1.5"/>
    <path transform="translate(368,118)" d="M0,-11 L2.6,-2.6 L11,0 L2.6,2.6 L0,11 L-2.6,2.6 L-11,0 L-2.6,-2.6 Z" fill="#c98bf0"/>
    <text x="368" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Generate</text>

    <!-- 4 Serve -->
    <rect x="483" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#e6a0c4" stroke-width="1.5"/>
    <g transform="translate(512,118)" stroke="#e6a0c4" stroke-width="1.8" fill="none">
      <circle cx="0" cy="0" r="9.5"/>
      <line x1="-9.5" y1="0" x2="9.5" y2="0"/>
      <ellipse cx="0" cy="0" rx="4.2" ry="9.5"/>
    </g>
    <text x="512" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Serve</text>

    <!-- 5 Verify -->
    <rect x="627" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#f6a87c" stroke-width="1.5"/>
    <path transform="translate(656,118)" d="M-9,0 L-2.5,6.5 L9.5,-7.5" fill="none" stroke="#f6a87c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="656" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Verify</text>

    <!-- 6 Open -->
    <rect x="771" y="89" width="58" height="58" rx="15" fill="#141a28" stroke="#7fe7d0" stroke-width="1.5"/>
    <g transform="translate(800,118)" stroke="#7fe7d0" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <line x1="-7" y1="7" x2="7" y2="-7"/>
      <path d="M0,-7 L7,-7 L7,0"/>
    </g>
    <text x="800" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#c7cee0">Open</text>
  </g>
</svg>
