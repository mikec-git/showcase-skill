<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Temporary Showcase Publish Test</title>
  <style>
    :root {
      --bg: #f6f3ed;
      --ink: #171512;
      --muted: #6b6257;
      --accent: #0f766e;
      --surface: #ffffff;
      --line: rgba(23, 21, 18, 0.16);
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(720px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 32px;
      box-shadow: 0 24px 60px rgba(23, 21, 18, 0.10);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      max-width: 58ch;
    }
    button {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font: inherit;
      cursor: pointer;
    }
    output {
      display: block;
      margin-top: 18px;
      color: var(--ink);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main data-checkpoint="test-card">
    <h1 data-checkpoint="text">Temporary GitHub Pages test</h1>
    <p data-checkpoint="text">This page verifies that Showcase can publish a temporary, shareable static artifact from the existing skill repository.</p>
    <button id="test-button" type="button">Run interaction test</button>
    <output id="result" aria-live="polite">Waiting for interaction.</output>
  </main>
  <script>
    document.getElementById("test-button").addEventListener("click", () => {
      document.getElementById("result").textContent = "Interaction verified.";
    });
  </script>
</body>
</html>
